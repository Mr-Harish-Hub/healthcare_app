<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin Login</title>
  <style>
    body{font-family:Arial;background:#eef1f4;margin:0;padding:0}
    .box{max-width:380px;margin:8% auto;background:#fff;padding:25px;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,0.1)}
    input{width:100%;padding:10px;margin:10px 0 20px 0;border:1px solid #ccc;border-radius:6px}
    button{width:100%;padding:12px;background:#2b6cb0;border:none;color:white;border-radius:6px;cursor:pointer}
  </style>
</head>
<body>
  <div class="box">
    <h2 style="text-align:center;margin-bottom:20px">Admin Login</h2>
    <form method="POST">
      <label>Email</label>
      <input name="email" required>
      <label>Password</label>
      <input type="password" name="password" required>
      <button>Sign In</button>
    </form>
    <div style="text-align:center;margin-top:10px"><a href="/home">Back to Home</a></div>
  </div>
</body>
</html>
