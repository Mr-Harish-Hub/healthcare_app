<!DOCTYPE html><html><head><meta charset="utf-8"><title>Your Appointments</title></head>
<body style="font-family:Arial;padding:24px">
<div style="max-width:960px;margin:auto">
  <h3>Your Appointments</h3><a href="/doctor/dashboard">Back</a>
  <table style="width:100%;margin-top:12px">
    <thead><tr style="background:#f5f5f5"><th>#</th><th>Patient</th><th>Date</th><th>Time</th><th>Status</th><th>Action</th></tr></thead>
    <tbody>
      {% for a in appointments %}
      <tr>
        <td>{{ loop.index }}</td>
        <td>{{ a['patient_name'] }}</td>
        <td>{{ a['date'] }}</td>
        <td>{{ a['time'] }}</td>
        <td>{{ a['status'] }}</td>
        <td><a href="/doctor/update/{{ a['id'] }}">Update</a></td>
      </tr>
      {% else %}
      <tr><td colspan="6">No appointments</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
</body></html>
