<!DOCTYPE html><html><head><meta charset="utf-8"><title>Doctor Login</title></head>
<body style="font-family:Arial;padding:24px">
<div style="max-width:420px;margin:auto;background:#fff;padding:20px;border-radius:8px">
  <h3>Doctor Sign In</h3>
  <form method="POST">
    <label>Name</label><input name="name" required style="width:100%;padding:8px;margin:6px 0"><br>
    <label>Password</label><input name="password" type="password" required style="width:100%;padding:8px;margin:6px 0"><br>
    <button style="background:#457b9d;color:#fff;padding:10px;border:none;border-radius:6px">Login</button>
  </form>
</div>
</body></html>
