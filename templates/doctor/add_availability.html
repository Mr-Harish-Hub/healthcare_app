<!DOCTYPE html><html><head><meta charset="utf-8"><title>Add Slots</title></head>
<body style="font-family:Arial;padding:24px">
<div style="max-width:520px;margin:auto;background:#fff;padding:20px;border-radius:8px">
  <h3>Set availability</h3>
  <form method="POST">
    <label>Date</label><input type="date" name="date" style="width:100%;padding:8px;margin:6px 0" required>
    <label>Slots</label>
    <div style="margin:6px 0"><label><input type="checkbox" name="time_slots" value="08:00-12:00"> 08:00-12:00</label></div>
    <div style="margin:6px 0"><label><input type="checkbox" name="time_slots" value="12:00-16:00"> 12:00-16:00</label></div>
    <div style="margin:6px 0"><label><input type="checkbox" name="time_slots" value="16:00-20:00"> 16:00-20:00</label></div>
    <button style="background:#457b9d;color:#fff;padding:10px;border:none;border-radius:6px">Save slots</button>
  </form>
</div>
</body></html>
