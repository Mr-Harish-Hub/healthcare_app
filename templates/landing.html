<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Clinic Portal</title>
  <style>
    body{font-family:Arial;background:#f4f7fb;margin:0}
    .box{max-width:380px;margin:8% auto;padding:28px;background:white;border-radius:10px;box-shadow:0 6px 22px rgba(10,20,30,0.08);text-align:center}
    a.btn{display:block;padding:12px;margin:10px 0;border-radius:8px;color:white;text-decoration:none}
    .a1{background:#2b8a8a} .a2{background:#2a6fbe} .a3{background:#e07a5f}
  </style>
</head>
<body>
  <div class="box">
    <h2>Clinic Portal</h2>
    <p style="color:#666">Choose your role</p>
    <a class="btn a1" href="/login">Admin</a>
    <a class="btn a2" href="/doctor/login">Doctor</a>
    <a class="btn a3" href="/patient/login">Patient</a>
  </div>
</body>
</html>
