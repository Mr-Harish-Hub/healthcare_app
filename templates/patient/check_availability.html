<!DOCTYPE html><html><head><meta charset="utf-8"><title>Slots</title></head>
<body style="font-family:Arial;padding:24px">
<div style="max-width:720px;margin:auto">
  <h3>Available slots</h3><a href="/patient/dashboard">Back</a>
  <table style="width:100%;margin-top:12px">
    <thead><tr style="background:#f3f3f3"><th>#</th><th>Date</th><th>Time</th><th>Book</th></tr></thead>
    <tbody>
      {% for s in slots %}
      <tr>
        <td>{{ loop.index }}</td>
        <td>{{ s['day'] }}</td>
        <td>{{ s['time_range'] }}</td>
        <td><a href="/patient/book-slot/{{ s['id'] }}">Book</a></td>
      </tr>
      {% else %}
      <tr><td colspan="4">No slots</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
</body></html>
