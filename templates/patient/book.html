<!DOCTYPE html><html><head><meta charset="utf-8"><title>Book</title></head>
<body style="font-family:Arial;padding:24px">
<div style="max-width:700px;margin:auto">
  <h3>Book Appointment</h3>
  <form method="POST">
    <label>Doctor</label>
    <select name="doctor_id" style="width:100%;padding:8px;margin:6px 0">
      {% for d in doctors %}
      <option value="{{ d['id'] }}">{{ d['name'] }} — {{ d['specialization'] }}</option>
      {% endfor %}
    </select>
    <label>Date</label><input type="date" name="date" required style="width:100%;padding:8px;margin:6px 0">
    <label>Time</label><input type="time" name="time" required style="width:100%;padding:8px;margin:6px 0">
    <button style="background:#2b8a8a;color:#fff;padding:10px;border:none;border-radius:6px">Book</button>
  </form>
</div>
</body></html>
