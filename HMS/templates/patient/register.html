<!DOCTYPE html><html><head><meta charset="utf-8"><title>Register</title></head>
<body style="font-family:Arial;padding:24px">
<div style="max-width:520px;margin:auto;background:#fff;padding:20px;border-radius:8px">
  <h3>Create Account</h3>
  <form method="POST">
    <label>Name</label><input name="name" required style="width:100%;padding:8px;margin:6px 0"><br>
    <label>Email</label><input name="email" required style="width:100%;padding:8px;margin:6px 0"><br>
    <label>Password</label><input name="password" type="password" required style="width:100%;padding:8px;margin:6px 0"><br>
    <label>Phone</label><input name="contact" style="width:100%;padding:8px;margin:6px 0"><br>
    <button style="background:#2a6fbe;color:#fff;padding:10px;border:none;border-radius:6px">Sign up</button>
  </form>
  <p style="margin-top:12px">Already registered? <a href="/patient/login">Login</a></p>
</div>
</body></html>
