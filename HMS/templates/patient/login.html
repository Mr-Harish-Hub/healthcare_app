<!DOCTYPE html><html><head><meta charset="utf-8"><title>Patient Login</title></head>
<body style="font-family:Arial;padding:24px">
<div style="max-width:420px;margin:auto;background:#fff;padding:20px;border-radius:8px">
  <h3>Patient Login</h3>
  <form method="POST">
    <label>Email</label><input name="email" required style="width:100%;padding:8px;margin:6px 0"><br>
    <label>Password</label><input name="password" type="password" required style="width:100%;padding:8px;margin:6px 0"><br>
    <button style="background:#3a86ff;color:#fff;padding:10px;border:none;border-radius:6px">Login</button>
  </form>
  <p style="margin-top:12px">Not registered? <a href="/patient/register">Sign up</a></p>
</div>
</body></html>
