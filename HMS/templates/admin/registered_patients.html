<!DOCTYPE html><html><head><meta charset="utf-8"><title>Registered Patients</title>
<style>body{font-family:Arial;background:#f4f6f8} .panel{max-width:1000px;margin:28px auto;padding:16px;background:#fff;border-radius:8px} table{width:100%;border-collapse:collapse} th,td{padding:10px;border-bottom:1px solid #eee} a{color:#1f6feb}</style>
</head>
<body>
  <div class="panel">
    <h2>Patients</h2>
    <div style="margin-bottom:10px"><a href="/admin/dashboard">Back</a></div>
    <table>
      <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Contact</th><th>Actions</th></tr></thead>
      <tbody>
        {% for p in patients %}
        <tr>
          <td>{{ loop.index }}</td>
          <td>{{ p['name'] }}</td>
          <td>{{ p['email'] }}</td>
          <td>{{ p['contact'] }}</td>
          <td>
            <a href="/admin/patient-history/{{ p['id'] }}">History</a> |
            <a href="/admin/delete-patient/{{ p['id'] }}">Delete</a>
          </td>
        </tr>
        {% else %}
        <tr><td colspan="5">No patients yet</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
