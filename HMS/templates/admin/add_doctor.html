<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Add Doctor</title>
<style>body{font-family:Arial;background:#f6f8fb} .box{max-width:620px;margin:36px auto;background:#fff;padding:18px;border-radius:8px} label{display:block;margin-top:10px} input,textarea{width:100%;padding:8px;margin-top:6px;border-radius:6px;border:1px solid #ccc} button{margin-top:12px;padding:10px 14px;background:#2b8a8a;border:none;color:#fff;border-radius:6px;cursor:pointer}</style>
</head>
<body>
  <div class="box">
    <h2>Register new doctor</h2>
    <form method="POST" action="/admin/add-doctor">
      <label>Full name<input name="name" required></label>
      <label>Specialization<input name="specialization" required></label>
      <label>Availability notes<textarea name="availability" rows="3"></textarea></label>
      <label>Password (doctor portal)<input type="password" name="password"></label>
      <button type="submit">Add doctor</button>
    </form>
    <a href="/admin/view-doctors">← Back to doctors</a>
  </div>
</body>
</html>
