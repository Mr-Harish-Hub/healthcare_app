<!DOCTYPE html><html><head><meta charset="utf-8"><title>Appointments</title>
<style>body{font-family:Arial;background:#f7f9fc}.box{max-width:1000px;margin:28px auto;padding:16px;background:#fff;border-radius:8px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee} a{color:#1f6feb}</style></head>
<body>
  <div class="box">
    <h2>Appointments</h2>
    <div><a href="/admin/dashboard">Back</a></div>
    <table>
      <thead><tr><th>#</th><th>Patient</th><th>Doctor</th><th>Date</th><th>Time</th><th>Status</th></tr></thead>
      <tbody>
        {% for a in appointments %}
        <tr>
          <td>{{ loop.index }}</td>
          <td>{{ a['patient_name'] or '-' }}</td>
          <td>{{ a['doctor_name'] or '-' }}</td>
          <td>{{ a['date'] }}</td>
          <td>{{ a['time'] }}</td>
          <td>{{ a['status'] }}</td>
        </tr>
        {% else %}
        <tr><td colspan="6">No appointments</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
